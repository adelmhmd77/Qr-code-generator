<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr code generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <p>Enter Your Text or URL</p>
        <input type="text" placeholder="Text or Url" id="qrt">
        <div class="imgBox">
            <img src="" id="qri">
        </div>
        <button onclick="generateQr()">Generate Qr Code</button>

    </div>
</body>
<script>
    let imgbox = document.querySelector('.imgBox')
    let qri = document.querySelector('#qri')
    let qrt = document.querySelector('#qrt')
    function generateQr(){
        qri.src = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + qrt.value
        imgbox.classList.add('show-img')
    }
</script>
</html>
